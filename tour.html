<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>It's Showtime — Guided Tour</title>
<style>
  :root{
    --bg:#0b0d17; --panel:#12152b; --line:#2b3050; --cyan:#00BFFF; --gold:#f4b740;
    --text:#e8eaf0; --muted:#8a93b2;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);
    -webkit-font-smoothing:antialiased;overflow:hidden}
  .wrap{display:flex;flex-direction:column;height:100vh}

  /* stage */
  .stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;
    padding:14px 14px 6px;min-height:0;
    background:radial-gradient(120% 90% at 50% 0%,rgba(0,191,255,.06),transparent 60%),var(--bg)}
  .frame{max-width:100%;max-height:100%;border-radius:10px;border:1px solid var(--line);
    box-shadow:0 24px 70px rgba(0,0,0,.6);object-fit:contain;background:#000;cursor:pointer;
    transition:opacity .18s ease}
  .frame.fading{opacity:.35}

  /* click zones (prev/next halves) */
  .zone{position:absolute;top:14px;bottom:6px;width:34%;cursor:pointer;z-index:2}
  .zone.prev{left:14px}
  .zone.next{right:14px}
  .zone .hint{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;
    border-radius:50%;background:rgba(18,21,43,.72);border:1px solid var(--line);color:var(--text);
    display:flex;align-items:center;justify-content:center;font-size:22px;opacity:0;transition:opacity .18s}
  .zone.prev .hint{left:6px}.zone.next .hint{right:6px}
  .zone:hover .hint{opacity:1}
  .zone.disabled{cursor:default}.zone.disabled .hint{display:none}

  /* control bar */
  .bar{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);
    border-top:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:9px;font-weight:800;letter-spacing:.02em;white-space:nowrap}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(244,183,64,.18)}
  .brand b{color:var(--cyan)}
  .btn{background:#1a2140;border:1px solid var(--line);color:var(--text);border-radius:8px;
    padding:8px 12px;font:600 13px var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:6px;
    transition:.15s;white-space:nowrap}
  .btn:hover{border-color:var(--cyan)}
  .btn.primary{background:var(--cyan);color:#04121b;border-color:var(--cyan)}
  .btn:disabled{opacity:.4;cursor:default;border-color:var(--line)}
  .counter{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;min-width:70px;text-align:center}
  .track{flex:1;height:6px;background:#0d1120;border-radius:20px;overflow:hidden;cursor:pointer;min-width:80px}
  .track .fill{height:100%;width:0;background:linear-gradient(90deg,var(--cyan),#7fdcff);transition:width .18s}
  .speedbox{display:flex;align-items:center;gap:8px;background:#0d1120;border:1px solid var(--line);
    border-radius:8px;padding:6px 11px;white-space:nowrap}
  .speedbox .slabel{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .speedbox .sread{font-size:12px;color:var(--cyan);font-variant-numeric:tabular-nums;min-width:34px;text-align:right;font-weight:600}
  #speed{-webkit-appearance:none;appearance:none;width:120px;height:5px;border-radius:20px;
    background:linear-gradient(90deg,#233056,#3a68b8);outline:none;cursor:pointer}
  #speed::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;
    background:var(--cyan);border:2px solid #04121b;cursor:pointer;box-shadow:0 1px 5px rgba(0,0,0,.5)}
  #speed::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--cyan);
    border:2px solid #04121b;cursor:pointer}
  .tunebar{display:none;flex-direction:column;gap:8px;padding:9px 16px;background:#0e1329;
    border-top:1px solid var(--line);font-size:13px}
  .tunebar.on{display:flex}
  .tunebar .trow{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
  .tunebar b{color:var(--cyan)}
  .tunebar input[type=number],.tunebar input[type=text]{background:#0d1120;border:1px solid var(--line);
    color:var(--text);border-radius:7px;padding:6px 8px;font:inherit}
  .tunebar input.num{width:60px}.tunebar input.txt{width:150px}
  .tunebar select{background:#0d1120;border:1px solid var(--line);color:var(--text);border-radius:7px;padding:6px 8px;font:inherit}
  .tunebar .thint{color:var(--muted);font-size:12px}
  .tunebar .glyphs{display:inline-flex;gap:4px}
  .tunebar .glyphs button{background:#1a2140;border:1px solid var(--line);color:var(--text);
    border-radius:6px;padding:4px 9px;cursor:pointer;font-size:14px;line-height:1}
  .tunebar .glyphs button:hover{border-color:var(--cyan)}

  /* ── data-driven key-hint overlay (sits over the screenshot, near the action) ── */
  .keyoverlay{position:absolute;pointer-events:none;z-index:3;overflow:visible}
  .keyhint{position:absolute;transform:translate(-50%,-50%);display:inline-flex;align-items:center;gap:9px;
    padding:7px 11px;border-radius:11px;background:rgba(8,11,24,.84);border:1px solid var(--line);
    box-shadow:0 8px 24px rgba(0,0,0,.5);white-space:nowrap;font:600 13px var(--sans)}
  .keyhint .caps{display:inline-flex;gap:5px}
  .keycap{min-width:28px;height:28px;padding:0 7px;border-radius:7px;display:inline-flex;align-items:center;
    justify-content:center;font-weight:800;font-size:15px;line-height:1;border:1px solid;border-bottom-width:4px;
    transition:transform .14s ease,border-bottom-width .14s ease,box-shadow .14s ease,filter .14s ease}
  /* pressed & HELD for the whole slide (not a momentary tap) */
  .keyhint.held .keycap{transform:translateY(3px);border-bottom-width:1px;filter:brightness(1.18)}
  .keyhint.nav.held .keycap{box-shadow:0 0 0 2px rgba(0,191,255,.35),0 0 14px rgba(0,191,255,.5)}
  .keyhint.action.held .keycap{box-shadow:0 0 0 2px rgba(244,183,64,.35),0 0 14px rgba(244,183,64,.55)}
  .keyhint .klabel{font-size:12.5px;letter-spacing:.01em}
  /* two languages: nav = move around (cyan), action = does a function like transpose (gold) */
  .keyhint.nav{color:#cfeaff}
  .keyhint.nav .keycap{background:#123049;border-color:#2a6fa0;border-bottom-color:#0f2740;color:#eaf6ff}
  .keyhint.nav .klabel{color:#7fc8f5}
  .keyhint.action{color:#ffe6b0}
  .keyhint.action .keycap{background:#3a2c0e;border-color:#7a5a1e;border-bottom-color:#3a2a0b;color:#ffeec6}
  .keyhint.action .klabel{color:var(--gold)}
  /* prominent button-graphic hints (static/button_icons/*_button.png) */
  .keyhint .keybtn{display:block;height:56px;width:auto;transition:transform .14s ease,filter .14s ease;
    filter:drop-shadow(0 4px 9px rgba(0,0,0,.55))}
  .keyhint.held .keybtn{transform:translateY(3px) scale(.97);filter:drop-shadow(0 1px 3px rgba(0,0,0,.55)) brightness(1.22)}
  .keyhint.hasimg{background:none;border:none;box-shadow:none;padding:0}   /* let the graphic stand on its own */
  @media(prefers-reduced-motion:reduce){.keycap,.keybtn{transition:none}}

  /* text caption overlay (also data-driven, so captions aren't baked into the screenshots) */
  .textnote{position:absolute;transform:translate(-50%,-50%);max-width:46%;padding:9px 13px;border-radius:10px;
    background:rgba(8,11,24,.86);border:1px solid var(--line);border-left:3px solid var(--cyan);
    box-shadow:0 8px 24px rgba(0,0,0,.5);color:var(--text);font:600 14px var(--sans);line-height:1.35;
    white-space:pre-wrap;animation:noteIn .28s ease}
  .textnote.s{font-size:12.5px;padding:7px 10px}
  .textnote.l{font-size:17px;padding:11px 15px}
  @keyframes noteIn{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}
  @media(prefers-reduced-motion:reduce){.textnote{animation:none}}

  /* end-of-tour call to action */
  .cta{position:absolute;inset:14px 14px 6px;z-index:6;display:none;align-items:center;justify-content:center;
    background:radial-gradient(120% 90% at 50% 40%,rgba(0,191,255,.14),rgba(11,13,23,.86) 70%);
    backdrop-filter:blur(4px);border-radius:10px}
  .cta.on{display:flex;animation:noteIn .35s ease}
  .ctabox{text-align:center;padding:26px 30px;max-width:520px}
  .ctatitle{font-size:26px;font-weight:800;letter-spacing:.01em;text-wrap:balance}
  .ctasub{color:var(--muted);margin:8px 0 20px;font-size:15px}
  .ctabtn{display:inline-flex;align-items:center;background:var(--cyan);color:#04121b;text-decoration:none;
    font-weight:800;font-size:16px;padding:13px 26px;border-radius:10px;box-shadow:0 8px 28px rgba(0,191,255,.35);
    transition:.15s}
  .ctabtn:hover{transform:translateY(-1px);box-shadow:0 12px 34px rgba(0,191,255,.5)}
  .ctarestart{display:block;margin:16px auto 0;background:none;border:none;color:var(--muted);cursor:pointer;
    font:600 13px var(--sans)}
  .ctarestart:hover{color:var(--text)}
  @media(max-width:680px){
    .bar{flex-wrap:wrap;gap:8px}.track{order:5;flex-basis:100%}.brand{display:none}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage" id="stage">
    <img class="frame" id="frame" alt="It's Showtime tour" draggable="false">
    <div class="zone prev" id="zPrev" title="Previous"><span class="hint">&lsaquo;</span></div>
    <div class="zone next" id="zNext" title="Next"><span class="hint">&rsaquo;</span></div>
    <div class="keyoverlay" id="keyoverlay"></div>
    <div class="cta" id="cta">
      <div class="ctabox">
        <div class="ctatitle">That&rsquo;s the tour &mdash; now it&rsquo;s your turn.</div>
        <div class="ctasub">Jump in and run your first show.</div>
        <a class="ctabtn" id="ctaBtn" href="#" target="_blank" rel="noopener">&#9654;&nbsp; Try It&rsquo;s Showtime</a>
        <button class="ctarestart" id="ctaRestart">&#8635; Watch again</button>
      </div>
    </div>
    <div id="ccbar" aria-live="polite" style="position:absolute;left:0;right:0;bottom:0;padding:14px 18px;text-align:center;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff;font-size:clamp(15px,2.1vw,22px);font-weight:600;line-height:1.35;text-shadow:0 2px 6px rgba(0,0,0,.9);pointer-events:none;opacity:0;transition:opacity .15s"></div>
  </div>
  <div class="tunebar" id="tunebar">
    <div class="trow">
      <b>&#9881; Slide <span id="tSlide">1</span></b>
      <span>shows for</span>
      <input type="number" class="num" id="tSec" min="0.1" max="30" step="0.1" value="3"> sec
      <button class="btn" id="tDefault" title="Use the default (slider) time for this slide">Use default</button>
      <span class="thint">Step through, set timing + key hints, then</span>
      <button class="btn primary" id="tCopy">&#128203; Copy config JSON</button>
      <span id="tCopied" class="thint" style="color:#3fb37f;display:none">&#10003; Copied — paste into v2/manifest.json</span>
    </div>
    <div class="trow">
      <b title="Key hint shown on this slide, over the screenshot">&#9000; Key hint</b>
      <span class="glyphs" id="tGlyphs">
        <button type="button" data-g="&#8593;">&#8593;</button><button type="button" data-g="&#8595;">&#8595;</button>
        <button type="button" data-g="&#8592;">&#8592;</button><button type="button" data-g="&#8594;">&#8594;</button>
        <button type="button" data-g="&#8629;">&#8629;</button><button type="button" data-g="Space">Space</button>
      </span>
      <input type="text" class="txt" id="tKeys" placeholder="keys e.g. &#8593; &#8595;" title="Space-separated key glyphs (or click the buttons)">
      <input type="text" class="txt" id="tLabel" placeholder="label e.g. transpose">
      <select id="tType" title="nav = move around · action = does a function"><option value="nav">nav (move)</option><option value="action">action (function)</option></select>
      <span class="thint">x/y%</span>
      <input type="number" class="num" id="tX" min="0" max="100" step="1" title="horizontal % across the screenshot">
      <input type="number" class="num" id="tY" min="0" max="100" step="1" title="vertical % down the screenshot">
      <button class="btn" id="tKclear" title="Remove this slide's key hint">Clear hint</button>
    </div>
    <div class="trow">
      <b title="Text caption shown on this slide, over the screenshot">&#128172; Caption</b>
      <input type="text" id="tText" style="flex:1;min-width:180px;background:#0d1120;border:1px solid var(--line);color:var(--text);border-radius:7px;padding:6px 8px;font:inherit" placeholder="caption text (blank = none)">
      <select id="tSize" title="text size"><option value="s">small</option><option value="m" selected>medium</option><option value="l">large</option></select>
      <span class="thint">x/y%</span>
      <input type="number" class="num" id="tTX" min="0" max="100" step="1" title="horizontal %">
      <input type="number" class="num" id="tTY" min="0" max="100" step="1" title="vertical %">
      <button class="btn" id="tTclear" title="Remove this slide's caption">Clear caption</button>
    </div>
    <div class="trow">
      <b title="What the AI voice reads on this slide">&#127908; Narration</b>
      <input type="text" id="tSay" style="flex:1;min-width:220px;background:#0d1120;border:1px solid var(--line);color:var(--text);border-radius:7px;padding:6px 8px;font:inherit" placeholder="spoken line for this slide (blank = silent)">
      <button class="btn" id="tSayPlay" title="Hear this line">&#9654; Say</button>
      <button class="btn" id="tSclear" title="Remove this slide's narration">Clear</button>
    </div>
  </div>
  <div class="bar">
    <div class="brand"><span class="dot"></span>It&rsquo;s&nbsp;<b>Showtime</b> — Tour</div>
    <button class="btn" id="first" title="Start (Home)">&laquo;</button>
    <button class="btn" id="prev" title="Previous (&larr;)">&lsaquo; Back</button>
    <button class="btn primary" id="play" title="Play / Pause (Space)">&#9654; Play</button>
    <button class="btn" id="next" title="Next (&rarr;)">Next &rsaquo;</button>
    <button class="btn" id="sound" title="Key-click sound on each slide">&#128264; Sound</button>
    <button class="btn" id="voice" title="AI voice-over — reads each slide's narration aloud">&#127908; Voice</button>
    <button class="btn" id="cc" title="Captions / subtitles on-off (for watching with the sound off)">CC</button>
    <button class="btn" id="tune" title="Set per-slide timings" style="display:none">&#9881; Tune</button>
    <div class="counter" id="counter">1 / 1</div>
    <div class="track" id="track" title="Jump"><div class="fill" id="fill"></div></div>
    <div class="speedbox" title="Drag to set the slideshow speed">
      <span class="slabel">Slow</span>
      <input type="range" id="speed" min="1" max="16" step="1" value="12">
      <span class="slabel">Fast</span>
      <span class="sread" id="speedRead">5.0s</span>
    </div>
  </div>
</div>

<script>
(function(){
  // Frame ids and play order come from v2/manifest.json ("order": ["st1.0","st2.0",…]). Kept empty
  // until that fetch resolves (bottom of this script); every render happens in its callback.
  var frames = [];
  var idx = 0, playing = false, timer = null;
  var img = document.getElementById('frame');
  var counter = document.getElementById('counter');
  var fill = document.getElementById('fill');
  var playBtn = document.getElementById('play');
  var speed = document.getElementById('speed');
  var speedRead = document.getElementById('speedRead');
  function curDuration(){ return 500 + (16 - parseInt(speed.value,10)) * 500; }   // slider 1..16 → 8s..0.5s
  function updateSpeedRead(){ speedRead.textContent = (curDuration()/1000).toFixed(1) + 's'; }

  // ── per-slide timings (from timings.json; the slider is the DEFAULT for un-tuned slides) ──
  var TIMINGS = { default: 3, frames: {} };
  var OV = {};   // live per-frame overrides in SECONDS (frameNumber → seconds)
  function durationFor(i){
    // Reading-time FLOOR only (the slide's set seconds / slider). When voice is on, narration drives
    // the real advance via speech onend (tryGo) — so nothing truncates and there's no manual padding.
    var f = frames[i];
    var s = (OV[f] != null) ? OV[f] : (curDuration()/1000);
    return Math.max(150, Math.round(s * 1000));
  }
  function setSliderFromSeconds(sec){
    var v = Math.round(16 - (sec*1000 - 500)/500);      // inverse of curDuration
    speed.value = String(Math.max(1, Math.min(16, v)));
  }

  // ── per-slide KEY HINTS (data-driven overlay drawn over the screenshot) ──
  // Config lives in timings.json under "keys": { frameNumber: {keys,label,type,x,y} }.
  // Two visual languages keep the meanings apart: type "nav" (move around) vs "action" (a function like transpose).
  var KEYS = {};   // frameNumber → {keys:[...], label, type, x, y}
  var TEXTS = {};  // frameNumber → {text, x, y, size}
  var SAY = {};    // frameNumber → narration text (spoken by the AI voice-over)
  var overlay = document.getElementById('keyoverlay');
  var POS = { 'top-left':[16,13],'top':[50,11],'top-right':[84,13],'left':[13,50],'center':[50,50],
              'right':[87,50],'bottom-left':[16,87],'bottom':[50,89],'bottom-right':[84,87] };
  function normKeys(v){
    if(v==null) return [];
    if(Array.isArray(v)) return v.map(String).filter(function(s){return s.length;});
    return String(v).trim().split(/\s+/).filter(Boolean);
  }
  function normHint(h){
    if(!h) return null;
    var x=(typeof h.x==='number')?h.x:null, y=(typeof h.y==='number')?h.y:null;
    if((x==null||y==null) && h.pos && POS[h.pos]){ x=POS[h.pos][0]; y=POS[h.pos][1]; }
    if(x==null) x=84; if(y==null) y=13;
    return { keys:normKeys(h.keys), label:h.label||'', type:(h.type==='action'?'action':'nav'), x:x, y:y, img:h.img||'' };
  }
  function normText(t){
    if(!t) return null;
    var x=(typeof t.x==='number')?t.x:null, y=(typeof t.y==='number')?t.y:null;
    if((x==null||y==null) && t.pos && POS[t.pos]){ x=POS[t.pos][0]; y=POS[t.pos][1]; }
    if(x==null) x=50; if(y==null) y=16;
    var sz=(t.size==='s'||t.size==='l')?t.size:'m';
    return { text:String(t.text||''), x:x, y:y, size:sz };
  }
  function positionOverlay(){
    if(!overlay) return;
    var s = document.getElementById('stage').getBoundingClientRect();
    var r = img.getBoundingClientRect();
    overlay.style.left = (r.left-s.left)+'px'; overlay.style.top = (r.top-s.top)+'px';
    overlay.style.width = r.width+'px'; overlay.style.height = r.height+'px';
  }
  // Key hints appear near the END of the slide (screen + narration explain first, THEN the keypress
  // that advances) — Rob. KEY_LEAD = how long before the slide flips the key presses in.
  var keyTimer = null, KEY_LEAD = 800;
  function drawKeyHint(h){
    var box = document.createElement('div');
    box.className = 'keyhint ' + (h.type==='action'?'action':'nav') + (h.img?' hasimg':'');
    box.style.left = h.x + '%'; box.style.top = h.y + '%';
    if(h.img){                                   // prominent button graphic
      var im = document.createElement('img'); im.className='keybtn'; im.src=h.img; im.alt='';
      box.appendChild(im);
    } else if(h.keys.length){                     // fallback: text keycaps
      var caps = document.createElement('span'); caps.className='caps';
      h.keys.forEach(function(k){ var c=document.createElement('span'); c.className='keycap'; c.textContent=k; caps.appendChild(c); });
      box.appendChild(caps);
    }
    if(h.label){ var l=document.createElement('span'); l.className='klabel'; l.textContent=h.label; box.appendChild(l); }
    overlay.appendChild(box);
    void box.offsetWidth; box.classList.add('held');   // press down
  }
  function renderCurrentHint(showKey){
    if(!overlay) return;
    overlay.innerHTML = '';
    var f = frames[idx];
    // text caption (always immediate)
    var t = TEXTS[f];
    if(t && t.text){
      var note = document.createElement('div');
      note.className = 'textnote' + (t.size==='s'?' s':t.size==='l'?' l':'');
      note.style.left = t.x + '%'; note.style.top = t.y + '%';
      note.textContent = t.text;
      overlay.appendChild(note);
    }
    // key hint immediately only when NOT deferring (e.g. the ?tune editor) — showKey===false skips it
    var h = KEYS[f];
    if(showKey !== false && h && (h.keys.length || h.label)) drawKeyHint(h);
    positionOverlay();
  }
  // Draw + press the key (called near the end of the slide, or immediately when parked/stepping).
  function revealKeyHint(withSound){
    if(!overlay || overlay.querySelector('.keyhint')) return;
    var h = KEYS[frames[idx]];
    if(h && (h.keys.length || h.label)){ drawKeyHint(h); if(withSound) keyClick(); }
  }
  function scheduleKeyHint(){
    clearTimeout(keyTimer);
    var h = KEYS[frames[idx]];
    if(!(h && (h.keys.length || h.label))) return;
    if(!playing) revealKeyHint(false);    // parked/stepping → show now; during play tryGo presses it in at the real end
  }
  img.addEventListener('load', positionOverlay);
  window.addEventListener('resize', positionOverlay);

  // ── synthesized key-press "tick" on each advance (Web Audio, no files) ──
  var actx = null, audioOn = false, soundBtn = document.getElementById('sound');
  function keyClick(){
    if(!audioOn || !actx) return;
    var t = actx.currentTime;
    // percussive noise "clack"
    var len = Math.floor(actx.sampleRate * 0.03), buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
    for(var i=0;i<len;i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 3);
    var noise = actx.createBufferSource(); noise.buffer = buf;
    var bp = actx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2400; bp.Q.value=0.7;
    var g = actx.createGain(); g.gain.setValueAtTime(0.22, t); g.gain.exponentialRampToValueAtTime(0.001, t+0.04);
    noise.connect(bp); bp.connect(g); g.connect(actx.destination); noise.start(t); noise.stop(t+0.05);
    // low "thock"
    var osc = actx.createOscillator(); osc.type='sine';
    osc.frequency.setValueAtTime(170, t); osc.frequency.exponentialRampToValueAtTime(85, t+0.03);
    var g2 = actx.createGain(); g2.gain.setValueAtTime(0.16, t); g2.gain.exponentialRampToValueAtTime(0.001, t+0.05);
    osc.connect(g2); g2.connect(actx.destination); osc.start(t); osc.stop(t+0.06);
  }
  soundBtn.onclick = function(){
    audioOn = !audioOn;
    if(audioOn && !actx){ try{ actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioOn=false; return; } }
    if(actx && actx.state==='suspended') actx.resume();
    soundBtn.classList.toggle('primary', audioOn);
    soundBtn.innerHTML = audioOn ? '🔊 Sound' : '🔇 Muted';
    if(audioOn) keyClick();
  };

  // ── AI voice-over (browser speech synthesis reads the per-slide 'say' line) ──
  // Zero-setup and works today; for studio quality, drop per-slide MP3s later (see audio hook below).
  var voiceOn = false, synth = window.speechSynthesis || null, pickedVoice = null,
      voiceBtn = document.getElementById('voice'), curAudio = null;
  function chooseVoice(){
    if(!synth) return;
    var vs = synth.getVoices() || [];
    pickedVoice =
      vs.find(function(v){ return /natural|neural/i.test(v.name) && /^en/i.test(v.lang); }) ||
      vs.find(function(v){ return /en[-_]?AU/i.test(v.lang); }) ||
      vs.find(function(v){ return /Aria|Jenny|Google US English|Samantha|Zira/i.test(v.name); }) ||
      vs.find(function(v){ return /^en/i.test(v.lang); }) || vs[0] || null;
  }
  if(synth){ chooseVoice(); if('onvoiceschanged' in synth) synth.onvoiceschanged = chooseVoice; }
  function stopSpeech(){
    if(synth){ try{ synth.cancel(); }catch(e){} }
    if(curAudio){ try{ curAudio.onended=null; curAudio.onerror=null; curAudio.pause(); }catch(e){} curAudio=null; }
  }
  // Normalize for the voice only (stored text keeps "2-5-1"): a hyphen BETWEEN digits reads as "dash"
  // in TTS, so turn "2-5-1"/"6-2-5-1" into "2 5 1"/"6 2 5 1" → spoken "two five one" etc.
  function sayText(f){ return (SAY[f] || '').trim().replace(/(\d)\s*-\s*(?=\d)/g, '$1 '); }
  function speak(text){
    if(!synth || !text) return;
    stopSpeech();
    var u = new SpeechSynthesisUtterance(text);
    if(pickedVoice) u.voice = pickedVoice;
    u.rate = 0.98; u.pitch = 1.0;
    u.onend = function(){ if(playing) tryGo(); };   // auto-wait: advance once narration finishes
    synth.speak(u);
  }
  function speakCurrent(){
    stopSpeech();
    if(!voiceOn) return;
    var f = frames[idx], txt = sayText(f);
    if(!txt) return;                                        // no narration on this slide
    // Prefer a pre-rendered studio MP3 (showtimeSimulator/vo/<id>.mp3); fall back to browser speech.
    var a = new Audio('showtimeSimulator/vo/' + encodeURIComponent(f) + '.mp3');
    curAudio = a;
    a.onended = function(){ if(playing && curAudio===a) tryGo(); };
    a.onerror = function(){ if(curAudio===a){ curAudio = null; speak(txt); } };   // missing/failed → browser voice
    var p = a.play();
    if(p && p.catch) p.catch(function(){ if(curAudio===a){ curAudio = null; speak(txt); } });
  }
  function estSpeechMs(text){ var w = (String(text).trim().match(/\S+/g) || []).length; return w ? (w*360 + 900) : 0; }
  if(!synth && voiceBtn){ voiceBtn.disabled = true; voiceBtn.title = 'Voice-over needs a browser that supports speech synthesis'; }
  voiceBtn.onclick = function(){
    if(!synth) return;
    voiceOn = !voiceOn;
    voiceBtn.classList.toggle('primary', voiceOn);
    voiceBtn.innerHTML = voiceOn ? '🎙 Voice on' : '🎤 Voice';
    if(voiceOn) speakCurrent(); else stopSpeech();
    if(playing) schedule();   // re-time so a narrated slide isn't cut off
  };

  // Default Voice + Sound ON (Rob). Browsers gate audio until a user gesture, so set the on-state +
  // button UI now, and unlock the AudioContext / start narration on the first click or keypress.
  (function defaultsOn(){
    if(synth){ voiceOn = true; voiceBtn.classList.add('primary'); voiceBtn.innerHTML = '🎙 Voice on'; }
    audioOn = true; soundBtn.classList.add('primary'); soundBtn.innerHTML = '🔊 Sound';
    try{ if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ audioOn = false; }
    function unlock(){
      try{ if(actx && actx.state==='suspended') actx.resume(); }catch(e){}
      if(voiceOn) speakCurrent();                 // kick narration for the current slide once allowed
      window.removeEventListener('pointerdown', unlock);
      window.removeEventListener('keydown', unlock);
    }
    window.addEventListener('pointerdown', unlock);
    window.addEventListener('keydown', unlock);
  })();

  // ── On-screen captions (subtitles): show the spoken line, for sound-off viewers. Default ON. ──
  var ccOn = true, ccBar = document.getElementById('ccbar'), ccBtn = document.getElementById('cc');
  function renderCaption(){
    if(!ccBar) return;
    var t = ccOn ? (SAY[frames[idx]] || '').trim() : '';   // raw narration reads better than the TTS-normalized form
    ccBar.textContent = t;
    ccBar.style.opacity = (ccOn && t) ? '1' : '0';
  }
  if(ccBtn){
    ccBtn.classList.add('primary');                        // default ON
    ccBtn.onclick = function(){ ccOn = !ccOn; ccBtn.classList.toggle('primary', ccOn); renderCaption(); };
  }

  function src(n){ return 'showtimeSimulator/' + n + '.webp'; }

  // Preload neighbours so advancing is instant.
  var cache = {};
  function preload(n){ if(n<0||n>=frames.length||cache[n]) return; var im=new Image(); im.src=src(frames[n]); cache[n]=im; }

  function show(n, animate){
    idx = Math.max(0, Math.min(frames.length-1, n));
    var url = src(frames[idx]);
    if(cache[idx] && cache[idx].complete){
      img.src = url; img.classList.remove('fading');          // warmed frame → instant swap
    } else {
      if(animate) img.classList.add('fading');
      var pre = new Image();
      pre.onload = function(){ img.src = url; img.classList.remove('fading'); };
      pre.onerror = function(){ img.src = url; img.classList.remove('fading'); };
      pre.src = url;
    }
    counter.textContent = (idx+1) + ' / ' + frames.length;
    fill.style.width = (frames.length<2?100:(idx/(frames.length-1))*100) + '%';
    renderCurrentHint(false); scheduleKeyHint();   // caption now; key presses in near the slide's end
    renderCaption();                             // subtitle line — for viewers with the sound off
    speakCurrent();                              // narrate this slide (if voice-over is on)
    setCTA(idx === frames.length-1);             // show the "try it" card on the last slide
    if(tuneMode) updateTune();
    document.getElementById('prev').disabled = idx===0;
    document.getElementById('first').disabled = idx===0;
    document.getElementById('next').disabled = idx===frames.length-1;
    document.getElementById('zPrev').classList.toggle('disabled', idx===0);
    document.getElementById('zNext').classList.toggle('disabled', idx===frames.length-1);
    preload(idx+1); preload(idx+2); preload(idx-1);
    if(playing && idx===frames.length-1) stop();   // auto-stop at the end
  }

  function go(delta){ keyClick(); show(idx+delta, true); }

  function play(){
    if(idx>=frames.length-1) show(0,true);
    playing=true; playBtn.innerHTML='&#10073;&#10073; Pause';
    schedule();
  }
  function stop(){ playing=false; playBtn.innerHTML='&#9654; Play'; clearTimeout(timer); clearTimeout(keyTimer); }
  function toggle(){ if(playing){ stop(); stopSpeech(); } else play(); }

  // end-of-tour call-to-action
  var cta = document.getElementById('cta');
  function setCTA(on){ if(cta) cta.classList.toggle('on', !!on); }
  var TRY_URL = 'https://showtime-saas.fly.dev';   // overridable via timings.json "tryUrl"
  (function(){
    var b=document.getElementById('ctaBtn'); if(b) b.href = TRY_URL;
    var r=document.getElementById('ctaRestart');
    if(r) r.onclick = function(){ setCTA(false); stopSpeech(); show(0,true); play(); };
  })();
  // Auto-wait-for-narration + a beat after button slides. schedule() runs the reading-time FLOOR;
  // the slide only advances once BOTH the floor elapsed AND narration finished (tryGo), then pauses
  // BUTTON_BREAK ms after a button/key slide so explanations don't run together (Rob).
  var minDone = false, BUTTON_BREAK = 800;    // beat after a button EXPLANATION (not rapid nav steps)
  function schedule(){
    clearTimeout(timer);
    if(!playing) return;
    minDone = false;
    timer = setTimeout(function(){ minDone = true; tryGo(); }, durationFor(idx));
  }
  function tryGo(){
    if(!playing || !minDone) return;
    if(voiceOn && ((synth && (synth.speaking || synth.pending)) || (curAudio && !curAudio.paused && !curAudio.ended))) return;   // still narrating → wait for onend
    revealKeyHint(true);                                                // press the button in at the real end
    // break only after a button EXPLANATION (keyed slide that dwells ≥1s) — skips rapid nav-stepping slides
    var brk = (KEYS[frames[idx]] && durationFor(idx) >= 1000) ? BUTTON_BREAK : 0;
    clearTimeout(timer);
    timer = setTimeout(function(){
      if(!playing) return;
      if(idx < frames.length - 1){ show(idx+1, true); schedule(); } else stop();
    }, brk);
  }

  // wire controls
  document.getElementById('next').onclick = function(){ stop(); go(1); };
  document.getElementById('prev').onclick = function(){ stop(); go(-1); };
  document.getElementById('first').onclick = function(){ stop(); show(0,true); };
  document.getElementById('zNext').onclick = function(){ stop(); go(1); };
  document.getElementById('zPrev').onclick = function(){ stop(); go(-1); };
  img.onclick = function(){ stop(); go(1); };
  playBtn.onclick = toggle;
  speed.oninput = function(){ updateSpeedRead(); if(playing) schedule(); };   // live speed while dragging
  document.getElementById('track').onclick = function(e){
    var r=this.getBoundingClientRect(); var p=(e.clientX-r.left)/r.width;
    stop(); show(Math.round(p*(frames.length-1)), true);
  };
  document.addEventListener('keydown', function(e){
    if(e.key==='ArrowRight'||e.key==='PageDown'){ stop(); go(1); e.preventDefault(); }
    else if(e.key==='ArrowLeft'||e.key==='PageUp'){ stop(); go(-1); e.preventDefault(); }
    else if(e.key===' '){ toggle(); e.preventDefault(); }
    else if(e.key==='Home'){ stop(); show(0,true); e.preventDefault(); }
    else if(e.key==='End'){ stop(); show(frames.length-1,true); e.preventDefault(); }
  });

  // ── timing tuner (opened by adding ?tune to the URL — hidden from normal visitors) ──
  var tuneMode = false;
  var tuneBtn = document.getElementById('tune'), tunebar = document.getElementById('tunebar');
  var tSlide = document.getElementById('tSlide'), tSec = document.getElementById('tSec'),
      tCopied = document.getElementById('tCopied');
  var tKeys=document.getElementById('tKeys'), tLabel=document.getElementById('tLabel'),
      tType=document.getElementById('tType'), tX=document.getElementById('tX'),
      tY=document.getElementById('tY'), tGlyphs=document.getElementById('tGlyphs'),
      tKclear=document.getElementById('tKclear');
  var tText=document.getElementById('tText'), tSize=document.getElementById('tSize'),
      tTX=document.getElementById('tTX'), tTY=document.getElementById('tTY'), tTclear=document.getElementById('tTclear');
  var tSay=document.getElementById('tSay'), tSayPlay=document.getElementById('tSayPlay'), tSclear=document.getElementById('tSclear');
  function curHint(){ var f=frames[idx]; if(!KEYS[f]) KEYS[f]={keys:[],label:'',type:'nav',x:84,y:13}; return KEYS[f]; }
  function curText(){ var f=frames[idx]; if(!TEXTS[f]) TEXTS[f]={text:'',x:50,y:16,size:'m'}; return TEXTS[f]; }
  function updateTune(){
    if(!tuneMode) return;
    tSlide.textContent = (idx+1);
    var f = frames[idx];
    tSec.value = (OV[f] != null ? OV[f] : (curDuration()/1000)).toFixed(1);
    var h = KEYS[f] || {keys:[],label:'',type:'nav',x:84,y:13};
    tKeys.value = h.keys.join(' '); tLabel.value = h.label || '';
    tType.value = h.type || 'nav'; tX.value = h.x; tY.value = h.y;
    var t = TEXTS[f] || {text:'',x:50,y:16,size:'m'};
    tText.value = t.text || ''; tSize.value = t.size || 'm'; tTX.value = t.x; tTY.value = t.y;
    tSay.value = SAY[f] || '';
    tCopied.style.display = 'none';
  }
  if(location.search.indexOf('tune') >= 0){
    tuneBtn.style.display = '';
    tuneBtn.onclick = function(){
      tuneMode = !tuneMode;
      tunebar.classList.toggle('on', tuneMode);
      tuneBtn.classList.toggle('primary', tuneMode);
      if(tuneMode){ stop(); updateTune(); }
    };
    tSec.oninput = function(){ var v = parseFloat(tSec.value); if(v>0){ OV[frames[idx]] = Math.round(v*10)/10; } tCopied.style.display='none'; };
    document.getElementById('tDefault').onclick = function(){ delete OV[frames[idx]]; updateTune(); };
    // key-hint editors — mutate KEYS live and re-render the overlay so you place it by eye
    tKeys.oninput  = function(){ curHint().keys = normKeys(tKeys.value); renderCurrentHint(); };
    tLabel.oninput = function(){ curHint().label = tLabel.value; renderCurrentHint(); };
    tType.onchange = function(){ curHint().type = tType.value; renderCurrentHint(); };
    tX.oninput = function(){ var v=parseFloat(tX.value); if(!isNaN(v)) curHint().x=Math.max(0,Math.min(100,v)); renderCurrentHint(); };
    tY.oninput = function(){ var v=parseFloat(tY.value); if(!isNaN(v)) curHint().y=Math.max(0,Math.min(100,v)); renderCurrentHint(); };
    tGlyphs.onclick = function(e){ var b=e.target.closest('button'); if(!b) return;
      var arr=normKeys(tKeys.value); arr.push(b.getAttribute('data-g')); tKeys.value=arr.join(' ');
      curHint().keys=arr; renderCurrentHint(); };
    tKclear.onclick = function(){ delete KEYS[frames[idx]]; updateTune(); renderCurrentHint(); };
    // caption editors
    tText.oninput = function(){ curText().text = tText.value; renderCurrentHint(); };
    tSize.onchange = function(){ curText().size = tSize.value; renderCurrentHint(); };
    tTX.oninput = function(){ var v=parseFloat(tTX.value); if(!isNaN(v)) curText().x=Math.max(0,Math.min(100,v)); renderCurrentHint(); };
    tTY.oninput = function(){ var v=parseFloat(tTY.value); if(!isNaN(v)) curText().y=Math.max(0,Math.min(100,v)); renderCurrentHint(); };
    tTclear.onclick = function(){ delete TEXTS[frames[idx]]; updateTune(); renderCurrentHint(); };
    // narration editors
    tSay.oninput = function(){ var v=tSay.value.trim(); if(v) SAY[frames[idx]]=v; else delete SAY[frames[idx]]; };
    tSayPlay.onclick = function(){ speak(tSay.value.trim()); };
    tSclear.onclick = function(){ delete SAY[frames[idx]]; updateTune(); stopSpeech(); };
    document.getElementById('tCopy').onclick = function(){
      var cfg = { default: Math.round((curDuration()/1000)*10)/10, order: frames.slice(), frames: {}, keys: {}, text: {}, say: {} };
      // Frame ids are strings now (e.g. "st6.1.2") — sort by PLAY ORDER, not Number() (which is NaN).
      var byOrder = function(a,b){ return frames.indexOf(a) - frames.indexOf(b); };
      Object.keys(OV).sort(byOrder).forEach(function(k){ cfg.frames[k] = OV[k]; });
      Object.keys(KEYS).sort(byOrder).forEach(function(k){
        var h=KEYS[k]; if(h && (h.keys.length || h.label)){ cfg.keys[k]={keys:h.keys,label:h.label,type:h.type,x:h.x,y:h.y}; }
      });
      Object.keys(TEXTS).sort(byOrder).forEach(function(k){
        var t=TEXTS[k]; if(t && t.text){ cfg.text[k]={text:t.text,x:t.x,y:t.y,size:t.size}; }
      });
      Object.keys(SAY).sort(byOrder).forEach(function(k){
        var s=String(SAY[k]||'').trim(); if(s){ cfg.say[k]=s; }
      });
      if(!Object.keys(cfg.keys).length) delete cfg.keys;
      if(!Object.keys(cfg.text).length) delete cfg.text;
      if(!Object.keys(cfg.say).length) delete cfg.say;
      var txt = JSON.stringify(cfg, null, 2);
      var done = function(){ tCopied.style.display=''; setTimeout(function(){ tCopied.style.display='none'; }, 5000); };
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(done).catch(function(){ prompt('Copy into v2/manifest.json:', txt); }); }
      else prompt('Copy into v2/manifest.json:', txt);
    };
  }

  // Load the v2 manifest (frame order + per-slide config), then start the slideshow.
  fetch('showtimeSimulator/manifest.json', {cache:'no-store'})
    .then(function(r){ return r.ok ? r.json() : {}; }).catch(function(){ return {}; })
    .then(function(cfg){
      if(cfg && Array.isArray(cfg.order) && cfg.order.length) frames = cfg.order.slice();
      if(cfg && typeof cfg.default === 'number') TIMINGS.default = cfg.default;
      if(cfg && cfg.frames && typeof cfg.frames === 'object'){
        Object.keys(cfg.frames).forEach(function(k){ var v=parseFloat(cfg.frames[k]); if(v>0) OV[k]=v; });
      }
      if(cfg && cfg.keys && typeof cfg.keys === 'object'){
        Object.keys(cfg.keys).forEach(function(k){ var h=normHint(cfg.keys[k]); if(h) KEYS[k]=h; });
      }
      if(cfg && cfg.text && typeof cfg.text === 'object'){
        Object.keys(cfg.text).forEach(function(k){ var tt=normText(cfg.text[k]); if(tt) TEXTS[k]=tt; });
      }
      if(cfg && cfg.say && typeof cfg.say === 'object'){
        Object.keys(cfg.say).forEach(function(k){ var s=String(cfg.say[k]||'').trim(); if(s) SAY[k]=s; });
      }
      if(cfg && typeof cfg.tryUrl === 'string' && cfg.tryUrl){
        TRY_URL = cfg.tryUrl; var b=document.getElementById('ctaBtn'); if(b) b.href = TRY_URL;
      }
      setSliderFromSeconds(TIMINGS.default);
      updateSpeedRead();
      if(!frames.length){ counter.textContent = '0 / 0'; return; }   // manifest missing → nothing to play
      show(0,false);
      play();   // auto-run the slideshow from the first frame
      setTimeout(function(){ for(var k=0;k<frames.length;k++) preload(k); }, 700);
    });
})();
</script>
</body>
</html>
